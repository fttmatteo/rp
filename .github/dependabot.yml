# Propuestas mensuales de actualización, agrupadas para no llenar de PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      # prisma y @prisma/* deben subir juntos: por separado no compilan.
      prisma:
        patterns: ["prisma", "@prisma/*"]
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      acciones:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      # Node impar (23, 25, 27...) no tiene soporte largo: solo se usan versiones pares (LTS).
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
